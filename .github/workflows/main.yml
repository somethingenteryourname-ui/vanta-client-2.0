name: Build VANTA Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The upload put the project in two folders (vanta-client and
      # VANTA-Client-Source/vanta-client). Merge them into one before building.
      - name: Merge project folders
        run: |
          mkdir -p vanta-client
          if [ -d VANTA-Client-Source/vanta-client ]; then
            cp -r VANTA-Client-Source/vanta-client/. vanta-client/
          fi
          ls vanta-client
          echo "Java files: $(find vanta-client -name '*.java' | wc -l)"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Make gradlew executable
        working-directory: vanta-client
        run: chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: vanta-client
        run: ./gradlew build --stacktrace

      - name: Check the jar
        working-directory: vanta-client
        run: |
          ls -la build/libs/
          unzip -l build/libs/VANTA-Client-1.21.11.jar | grep -E "fabric.mod.json|vanta.mixins.json|VantaClient.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Client-1.21.11
          path: vanta-client/build/libs/VANTA-Client-1.21.11.jar
