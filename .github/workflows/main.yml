name: Build VANTA Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # All source lives in vanta-client/. Fail early if an upload lands in an old folder.
      - name: Check project layout
        run: |
          for d in VANTA-Client-Source upload-these; do
            if [ -d "$d" ]; then
              echo "::error::Found '$d/'. Put files in vanta-client/src instead (see vanta-client/README.md)."
              exit 1
            fi
          done
          echo "Java files: $(find vanta-client -name '*.java' | wc -l)"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Make gradlew executable
        working-directory: vanta-client
        run: chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: vanta-client
        run: ./gradlew build --stacktrace

      - name: Check the jar
        working-directory: vanta-client
        run: |
          ls -la build/libs/
          unzip -l build/libs/VANTA-Client-1.21.11.jar | grep -E "fabric.mod.json|vanta.mixins.json|VantaClient.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Client-1.21.11
          path: vanta-client/build/libs/VANTA-Client-1.21.11.jar
